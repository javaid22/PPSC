<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preload Intro Slide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }

    /* === PRELOAD INTRO SECTION === */
    .preload-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s ease;
    }

    .preload-screen.slide-up {
      transform: translateY(-100%);
      opacity: 0;
    }

    .preload-content {
      text-align: center;
      padding: 20px;
      max-width: 700px;
    }

    .preload-content h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #FF6900, #FB00FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .preload-content img {
      width: 250px;
      height: auto;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255, 105, 0, 0.4);
    }

    .preload-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .preload-btn {
      padding: 12px 28px;
      border: 2px solid #fff;
      border-radius: 30px;
      background: transparent;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .preload-btn:hover {
      background: linear-gradient(90deg, #FF6900, #FB00FF);
      border-color: transparent;
      color: #fff;
      transform: scale(1.05);
    }

    /* === REST OF PAGE === */
    section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    section:nth-of-type(odd) {
      background: #111;
    }

    section:nth-of-type(even) {
      background: #222;
    }
  </style>
</head>
<body>

  <iframe class="scribd_iframe_embed" title="PPSC All Solved Past Papers" src="https://www.scribd.com/embeds/752661421/content?start_page=1&view_mode=scroll&access_key=key-S73w6q70NpAyCEdYkXYR" tabindex="0" data-auto-height="true" data-aspect-ratio="0.845360824742268" scrolling="no" width="100%" height="600" frameborder="0" ></iframe> <p style="margin: 12px auto 6px auto; font-family: Helvetica,Arial,Sans-serif; font-size: 14px; line-height: normal; display: block;"> <a title="View PPSC All Solved Past Papers on Scribd" href="https://www.scribd.com/document/752661421/PPSC-All-Solved-Past-Papers#from_embed" style="color: #098642; text-decoration: underline;"> PPSC All Solved Past Papers </a> by <a title="View WILLIAM PASHA's profile on Scribd" href="https://www.scribd.com/user/554122367/WILLIAM-PASHA#from_embed" style="color: #098642; text-decoration: underline;" > WILLIAM PASHA </a> </p> 

  <script>
    const preloadSeeMore = document.getElementById("preload-see-more");
    const preloadIntro = document.getElementById("preload-intro");

    preloadSeeMore.addEventListener("click", () => {
      preloadIntro.classList.add("slide-up");
      setTimeout(() => {
        preloadIntro.style.display = "none"; // hide after animation
      }, 1000);
    });
  </script>

</body>
</html>
